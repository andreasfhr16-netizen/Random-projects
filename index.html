<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-con">

        <div class="select-box">

            <div class="select-box-header">
                <p>Select a name from the dropdown:</p>
            </div>

            <div class="select-box-body">

                <form onsubmit="getname();">
                <select id="name" name="name">
                    <option value="jacob">Jacob</option>
                    <option value="sarah">Sarah</option>
                    <option value="fiona">Fiona</option>
                    <option value="alex">Alex</option>

                </select>
                <input type="submit" value="Submit">
                </form>


            </div>
        </div>



        <template id="my-template">

            <div>
                <h1>Hello, World!</h1>
                <p>This is a template example.</p>
            </div>
        </template>


    </div>

</body>
<script>
    function getname() {
        //tag value af inputet som er det valgte navn
        const selectedName = document.getElementById('name').value;
        console.log(selectedName);

        return selectedName;
    }
    //select name from template dropdown
    //the selected name gets written in a js canvas
    //viewable by the user 

    //const name_result = getname();
    //console.log(name_result);


</script>


</html>
